<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USD to INR Converter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      padding: 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      color: #203a43;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    .field {
      display: flex;
      align-items: center;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .field:focus-within { border-color: #2c5364; }

    .symbol {
      background: #f2f5f7;
      padding: 12px 14px;
      font-weight: 700;
      color: #2c5364;
      min-width: 52px;
      text-align: center;
    }

    .field input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px;
      font-size: 1.1rem;
      width: 100%;
    }

    .field input[readonly] { background: #fafafa; color: #203a43; font-weight: 600; }

    .swap-row { display: flex; justify-content: center; margin: 14px 0; }

    #swapBtn {
      background: #2c5364;
      color: #fff;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.3s, background 0.2s;
    }

    #swapBtn:hover { background: #203a43; transform: rotate(180deg); }

    .rate {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #333;
    }

    .status {
      margin-top: 6px;
      text-align: center;
      font-size: 0.75rem;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Currency Converter</h1>
    <p class="subtitle">US Dollar ⇄ Indian Rupee</p>

    <label id="fromLabel" for="amount">US Dollar (USD)</label>
    <div class="field">
      <span class="symbol" id="fromSymbol">$</span>
      <input type="number" id="amount" value="1" min="0" step="any" placeholder="Enter amount">
    </div>

    <div class="swap-row">
      <button id="swapBtn" title="Swap currencies">⇅</button>
    </div>

    <label id="toLabel" for="result">Indian Rupee (INR)</label>
    <div class="field">
      <span class="symbol" id="toSymbol">₹</span>
      <input type="text" id="result" readonly>
    </div>

    <p class="rate" id="rateText">Loading rate...</p>
    <p class="status" id="statusText"></p>
  </div>

  <script>
    const FALLBACK_RATE = 88.0; // used only if the live rate can't be fetched
    let usdToInr = FALLBACK_RATE;
    let isUsdToInr = true;

    const amountInput = document.getElementById("amount");
    const resultInput = document.getElementById("result");
    const rateText    = document.getElementById("rateText");
    const statusText  = document.getElementById("statusText");

    // Fetch live rate (free API, no key needed)
    async function fetchRate() {
      try {
        const res = await fetch("https://open.er-api.com/v6/latest/USD");
        const data = await res.json();
        if (data.result !== "success") throw new Error("Bad response");
        usdToInr = data.rates.INR;
        statusText.textContent = "Live rate · updated " +
          new Date(data.time_last_update_utc).toLocaleString();
      } catch (err) {
        statusText.textContent = "Offline — using approximate rate";
      }
      convert();
    }

    function convert() {
      const amount = parseFloat(amountInput.value);

      if (isUsdToInr) {
        rateText.textContent = `1 USD = ₹${usdToInr.toFixed(2)}`;
      } else {
        rateText.textContent = `1 INR = $${(1 / usdToInr).toFixed(4)}`;
      }

      if (isNaN(amount) || amount < 0) {
        resultInput.value = "";
        return;
      }

      const converted = isUsdToInr ? amount * usdToInr : amount / usdToInr;
      const locale = isUsdToInr ? "en-IN" : "en-US";
      resultInput.value = converted.toLocaleString(locale, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function swap() {
      isUsdToInr = !isUsdToInr;
      document.getElementById("fromLabel").textContent  = isUsdToInr ? "US Dollar (USD)" : "Indian Rupee (INR)";
      document.getElementById("toLabel").textContent    = isUsdToInr ? "Indian Rupee (INR)" : "US Dollar (USD)";
      document.getElementById("fromSymbol").textContent = isUsdToInr ? "$" : "₹";
      document.getElementById("toSymbol").textContent   = isUsdToInr ? "₹" : "$";
      convert();
    }

    amountInput.addEventListener("input", convert);
    document.getElementById("swapBtn").addEventListener("click", swap);

    fetchRate();
  </script>
</body>
</html>
